<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilo.css">
  <title>Login-EduCore</title>
</head>
<body>

  <div class="container" id="container">

    <div class="container-formulario cadastro">
      <form id="form-cadastro">

        <h1>Criar Conta</h1>
        <span>Use seu e-mail para cadastro</span>

        <input type="text" id="nome-cadastro" placeholder="Nome" maxlength="60" required>

        <input type="email" id="email-cadastro" placeholder="E-mail"
          maxlength="100" autocomplete="email" required>

        <input type="password" id="senha-cadastro" placeholder="Senha"
          minlength="8" maxlength="32" autocomplete="new-password" required>

        

        <select id="tipo-cadastro" required>
          <option value="">Selecione o tipo</option>
          <option value="aluno">Aluno</option>
          <option value="professor">Professor</option>
          <option value="responsavel">Responsável</option>
        </select>

        <button type="submit">Cadastrar</button>
        <p id="mensagem-cadastro"></p>

      </form>
    </div>

    <div class="container-formulario login">
      <form id="form-login">

        <h1>Entrar</h1>
        <span>Entre com seu e-mail e senha</span>

        <input type="email" id="email-login" placeholder="E-mail"
          maxlength="100" autocomplete="email" required>

        <input type="password" id="senha-login" placeholder="Senha"
          maxlength="32" autocomplete="current-password" required>

        <a href="#">Esqueceu sua senha?</a>

        <button type="submit">Entrar</button>
        <p id="mensagem-login"></p>

      </form>
    </div>

    <div class="container-alternar">
      <div class="alternar">

        <div class="painel-alternar alternar-esquerda">
          <h1>Bem-vindo de volta!</h1>
          <p>Insira seus dados pessoais para usar todos os recursos do site</p>
          <button class="oculto" id="entrar">Entrar</button>
        </div>

        <div class="painel-alternar alternar-direita">
          <h1>Ola, Amigo!</h1>
          <p>Cadastre-se com seus dados pessoais para usar todos os recursos do site</p>
          <button class="oculto" id="cadastrar">Cadastrar</button>
        </div>

      </div>
    </div>

  </div>

  <script src="./js/script.js"></script>
  <script type="module" src="./js/auth.js"></script>

</body>
</html>
